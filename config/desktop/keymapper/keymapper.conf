@allow-unmapped-commands
@enforce-lowercase-commands

@include "keymapper.conf.d/key_aliases.conf"
@include "keymapper.conf.d/window_matchers.conf"
@include "keymapper.conf.d/virtual_keys.conf"

# Debug log file
LOG_FILE = "~/.local/state/keymapper/keymapper.log"

# Startup
# Any changes in this stage will be sent to the next as input, i.e. if you
# change a keybinding here you can refer to it as it's bound value in the next
# stage
[stage]
# Adjust keyboard layout
# System-wide keyboard layout, e.g. "ie", is still configured in sway as it doesn't seem to inherit settings from localctl

# Use capslock as an additional modifier
CapsLock >> Ext ^ !Ext

# Shorthand
# Replace trigger string with the second argument
trigger = ? "$0" >> repeat[Backspace, sub[length["$0"], 1]] $1

# Send typed output
type = $(keymapperctl --type "$0")

# Format date
format_date = $(date +"$0")

# Stage 1
[stage]

# Abstract commands
# A different action can then be defined per context and it'll match the last
# entry, i.e. default will be overriden by a more specific context
#
# There's some system here but it's influenced by muscle memory

# Commands
AltLeft{Escape} >> launch_terminal
AltLeft{D} >> launch_launcher
AltLeft{Q} >> close_window
Ext{C} >> command

# Session commands
(AltLeft Ext A){L} >> lock_session
(AltLeft Ext A){E} >> exit_session
(AltLeft Ext A){R} >> reload_session
(AltLeft Ext A){Z} >> toggle_zoom
# (AltLeft Ext){P} >> print_screen
# (AltLeft Ext){S} >> stream
(AltLeft Ext A){Minus} >> brightness_down
(AltLeft Ext A){Equal} >> brightness_up

# Selection
Ext{H} >> shift_focus_left
Ext{J} >> shift_focus_down
Ext{K} >> shift_focus_up
Ext{L} >> shift_focus_right
Ext{F} >> toggle_focus_floating
Ext{U} >> shift_focus_parent

# Manipulation
(Ext A){H} >> move_left
(Ext A){J} >> vertical_split
(Ext A){K} >> horizontal_split
(Ext A){L} >> move_right
(Ext A){F} >> toggle_floating
(Ext A){U} >> toggle_fullscreen

# Workspace manipulation
(AltLeft Ext){1} >> move_to_workspace_1
(AltLeft Ext){2} >> move_to_workspace_2
(AltLeft Ext){3} >> move_to_workspace_3
(AltLeft Ext){4} >> move_to_workspace_4
(AltLeft Ext){5} >> move_to_workspace_5
(AltLeft Ext){6} >> move_to_workspace_6
(AltLeft Ext){7} >> move_to_workspace_7
(AltLeft Ext){8} >> move_to_workspace_8
(AltLeft Ext){9} >> move_to_workspace_9
(AltLeft Ext){0} >> move_to_workspace_10
(AltLeft Ext){H} >> move_workspace_to_output_left
(AltLeft Ext){L} >> move_workspace_to_output_right

# Workspace selection
AltLeft{1} >> select_workspace_1
AltLeft{2} >> select_workspace_2
AltLeft{3} >> select_workspace_3
AltLeft{4} >> select_workspace_4
AltLeft{5} >> select_workspace_5
AltLeft{6} >> select_workspace_6
AltLeft{7} >> select_workspace_7
AltLeft{8} >> select_workspace_8
AltLeft{9} >> select_workspace_9
AltLeft{0} >> select_workspace_10
AltLeft{Minus} >> toggle_scratchpad
AltLeft{Equal} >> cycle_layout

# Media  Maybe Control{Meta} ...
MediaTrackNext >> track_next
MediaTrackPrevious >> track_previous
MediaPlayPause >> play_pause

# Special keys to adjust volume via PulseAudio
# bindsym --locked XF86AudioMute exec pactl set-sink-mute \@DEFAULT_SINK@ toggle
# bindsym --locked XF86AudioLowerVolume exec pactl set-sink-volume \@DEFAULT_SINK@ -5%
# bindsym --locked XF86AudioRaiseVolume exec pactl set-sink-volume \@DEFAULT_SINK@ +5%
# bindsym --locked XF86AudioMicMute exec pactl set-source-mute \@DEFAULT_SOURCE@ toggle

# Logging
# Toggling explicit states when entering and leaving contexts
# This is logged and can be helpful when debugging
# [default]
# ContextActive   >> DefaultContext ^ !DefaultContext

# [class = Zed]
# ContextActive   >> ZedContext ^ !ZedContext

# [title = Tmux]
# ContextActive   >> TmuxContext ^ !TmuxContext

# Commands
# Navigation, launching, and so on
[default]
launch_terminal >> $(kitty --instance-group="default") ^
launch_launcher >> $(tofi-drun | xargs swaymsg exec --) ^

toggle_zoom >> $(woomer) ^

select_workspace_1 >> $(swaymsg workspace 1) ^
select_workspace_2 >> $(swaymsg workspace 2) ^
select_workspace_3 >> $(swaymsg workspace 3) ^
select_workspace_4 >> $(swaymsg workspace 4) ^
select_workspace_5 >> $(swaymsg workspace 5) ^
select_workspace_6 >> $(swaymsg workspace 6) ^
select_workspace_7 >> $(swaymsg workspace 7) ^
select_workspace_8 >> $(swaymsg workspace 8) ^
select_workspace_9 >> $(swaymsg workspace 9) ^
select_workspace_10 >> $(swaymsg workspace 10) ^
toggle_scratchpad >> $(swaymsg scratchpad show)
cycle_layout >> $(swaymsg layout toggle all)

move_to_workspace_1 >> $(swaymsg move container to workspace number 1) ^
move_to_workspace_2 >> $(swaymsg move container to workspace number 2) ^
move_to_workspace_3 >> $(swaymsg move container to workspace number 3) ^
move_to_workspace_4 >> $(swaymsg move container to workspace number 4) ^
move_to_workspace_5 >> $(swaymsg move container to workspace number 5) ^
move_to_workspace_6 >> $(swaymsg move container to workspace number 6) ^
move_to_workspace_7 >> $(swaymsg move container to workspace number 7) ^
move_to_workspace_8 >> $(swaymsg move container to workspace number 8) ^
move_to_workspace_9 >> $(swaymsg move container to workspace number 9) ^
move_to_workspace_10 >> $(swaymsg move container to workspace number 10) ^

move_workspace_to_output_left >> $(swaymsg move workspace to output left) ^
move_workspace_to_output_right >> $(swaymsg move workspace to output right) ^

toggle_fullscreen >> $(swaymsg fullscreen) ^
shift_focus_left >> $(swaymsg focus left) ^
shift_focus_down >> $(swaymsg focus down) ^
shift_focus_up >> $(swaymsg focus up) ^
shift_focus_right >> $(swaymsg focus right) ^
shift_focus_parent >> $(swaymsg focus parent) ^

move_left >> $(swaymsg 'move container to output left; focus output left') ^
vertical_split >> $(swaymsg splith) ^ # splith is intended
horizontal_split >> $(swaymsg splitv) ^
move_right >> $(swaymsg 'move container to output right; focus output right') ^

toggle_floating >> $(swaymsg floating toggle) ^
toggle_focus_floating >> $(swaymsg focus mode_toggle) ^

close_window >> $(swaymsg kill) ^

lock_session >> $(swaylock -f -c 000000) ^
exit_session >> $(swaynag -t warning -m 'Really want to quit?' -B 'Yes' 'swaymsg exit') ^
reload_session >> $(swaymsg reload) ^

brightness_down >> $(brightnessctl set 5%-; ddcutil --display 1 setvcp 10 - 5; ddcutil --display 2 setvcp 10 - 5)
brightness_up >> $(brightnessctl set 5%+; ddcutil --display 1 setvcp 10 + 5; ddcutil --display 2 setvcp 10 + 5)

# TODO: Tab & split navigation
# For these contexts we map my preferred commands to their application
# equivalent. Where there's a command interface to the application use that but
# otherwise just map to the applications default keybinding.
[class = Zed]
launch_terminal >> Control{Backquote}
vertical_split >> Control{W} V
horizontal_split >> Control{W} S

[title = Tmux]
launch_terminal >> $(tmux new-window) ^
vertical_split >> $(tmux split-window -h) ^
horizontal_split >> $(tmux split-window -v) ^
command >> Control{F}

[title = Zellij]
# TODO:
# launch_terminal >> $(zellij action new-tab) ^
# vertical_split >> $(zellij action new-pane -d right) ^
# horizontal_split >> $(zellij action new-pane -d down) ^
command >> Control{G}

[title = Helix]
vertical_split >> Control{W} V
horizontal_split >> Control{W} S

[class = Firefox]
# Slash >> search # Too intrusive unfortunately
search >> Control{F}

# Shorthand
# When the trigger string is detected it'll be replaced by the typed text
[default]
# Email addresses
trigger[":gm",   type["anntoin@gmail.com"]]
trigger[":kr",   type["\nKind regards,\nAnntóin"]]

# Timestamps
trigger[":time", type[format_date["%H:%M:%S"]]]
trigger[":dts",  type[format_date["%Y-%m-%d-%H-%M"]]]
trigger[":ds",   type[format_date["%Y-%m-%d"]]]

# Netmasks
trigger["//24",  type["255.255.255.0"]]
trigger["//16",  type["255.255.0.0"]]
trigger["//8",   type["255.0.0.0"]]

# UUID
trigger[":uuid", type[$(uuidgen -7)]]

# CAPS_WORD
# Press both shift keys to enable and again to disable
# TODO: indicate this is enabled in waybar
[default]
  ? (ShiftLeft ShiftRight) >> CapsWord ^

[modifier = "CapsWord"]
  CapsWordKey              >> Shift{CapsWordKey}
  Space                    >> "_"
